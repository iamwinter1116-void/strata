<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171008">
<meta name="description" content="STRATA — dig into a civilization that lives while you sleep. Every artifact carries a true story.">
<title>STRATA — The Civilization Beneath</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HUD TOP -->
  <header id="hud">
    <div id="hud-left">
      <div id="brand">STRATA</div>
      <div id="world-theme">—</div>
    </div>
    <div id="hud-right">
      <div class="res" id="res-shards"><span class="res-ico">◆</span><b id="shards">0</b></div>
      <div class="res" id="res-energy"><span class="res-ico">⚡</span><b id="energy">60</b></div>
      <button id="btn-sound" aria-label="Toggle sound">♪</button>
    </div>
  </header>

  <!-- NEWS TICKER -->
  <div id="ticker" aria-live="polite"></div>

  <!-- GAME STAGE -->
  <main id="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="vignette"></div>

    <div id="civ-pill">
      <span id="civ-pill-dot"></span>
      <span id="civ-pill-text">—</span>
    </div>

    <div id="depth-readout">—</div>

    <div id="energy-wrap"><div id="energy-fill"></div></div>

    <button id="dig-btn" aria-label="Dig">
      <span id="dig-label">HOLD TO DIG</span>
      <span id="dig-sub">every strike unearths years</span>
    </button>
  </main>

  <!-- SUMMON STRIP -->
  <div id="summon-strip">
    <button id="summon-btn">✦ Summon a people — <b id="summon-cost">20</b> ◆</button>
  </div>

  <!-- TAB RAIL -->
  <nav id="nav">
    <button class="nav-btn active" data-view="dig"><span>⛏</span>Site</button>
    <button class="nav-btn" data-view="civs"><span>⌂</span>People</button>
    <button class="nav-btn" data-view="museum"><span>◈</span>Museum</button>
    <button class="nav-btn" data-view="codex"><span>✝</span>Codex</button>
  </nav>

  <!-- OVERLAY PANEL -->
  <div id="panel" class="hidden">
    <div id="panel-head">
      <button id="panel-back">‹ back</button>
      <div id="panel-title">—</div>
    </div>
    <div id="panel-body"></div>
  </div>

  <!-- ARTIFACT MODAL -->
  <div id="modal" class="hidden">
    <div id="modal-card">
      <div id="modal-shine"></div>
      <div id="modal-icon">◈</div>
      <div id="modal-title">Artifact</div>
      <div id="modal-sub">—</div>
      <div id="modal-story">—</div>
      <div id="modal-meta">—</div>
      <button id="modal-close">Keep it</button>
    </div>
  </div>

</div>
<script src="engine.js"></script>
<script src="fx.js"></script>
<script src="site.js"></script>
<script src="monetization.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
